<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de teste</title>
    <style>
      body {
        align-items: center;
        background: #f4f7fb;
        color: #1f2937;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(31 41 55 / 12%);
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }

      h1 {
        color: #2563eb;
        margin-top: 0;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 8px;
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
        padding: 12px 20px;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Olá, mundo!</h1>
      <p>Esta é uma página HTML simples para teste.</p>
      <button type="button" onclick="alert('O botão está funcionando!')">
        Testar botão
      </button>
    </main>
  </body>
</html>
